<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Doctor Form | CityCare HMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container py-4">

    <div class="card border-0 shadow-sm mx-auto"
         style="max-width:700px">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Add Doctor
            </h2>

            <form th:action="@{/doctors/save}"
                  th:object="${doctor}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            Name <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{name}"
                               required
                               maxlength="100"
                               placeholder="Enter doctor name">

                        <div class="text-danger small"
                             th:errors="*{name}">
                        </div>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">
                            Specialization <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{specialization}"
                               required
                               maxlength="100"
                               placeholder="e.g. Cardiologist">

                        <div class="text-danger small"
                             th:errors="*{specialization}">
                        </div>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">
                            Phone <span class="text-danger">*</span>
                        </label>

                        <input type="tel"
                               class="form-control"
                               th:field="*{phone}"
                               required
                               pattern="[0-9]{10}"
                               minlength="10"
                               maxlength="10"
                               placeholder="10 digit phone number">

                        <div class="text-danger small"
                             th:errors="*{phone}">
                        </div>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">
                            Email <span class="text-danger">*</span>
                        </label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               required
                               placeholder="doctor@gmail.com">

                        <div class="text-danger small"
                             th:errors="*{email}">
                        </div>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">
                            Room Number <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{roomNumber}"
                               required
                               maxlength="100"
                               placeholder="e.g. 101">

                        <div class="text-danger small"
                             th:errors="*{roomNumber}">
                        </div>
                    </div>

                </div>


                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-primary">
                        Save Doctor
                    </button>

                    <a class="btn btn-light"
                       th:href="@{/doctors}">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</main>

</body>
</html>
