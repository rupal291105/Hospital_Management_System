<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Schedule Appointment | CityCare HMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>


<body>

<div th:replace="~{fragments/nav :: nav}"></div>


<main class="container py-4">

    <div class="card border-0 shadow-sm mx-auto"
         style="max-width:700px">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Schedule Appointment
            </h2>


            <form th:action="@{/appointments/save}"
                  th:object="${appointment}"
                  method="post">


                <!-- ========================= -->
                <!-- PATIENT -->
                <!-- ========================= -->

                <div class="mb-3">

                    <label class="form-label">
                        Patient
                        <span class="text-danger">*</span>
                    </label>


                    <select name="patientId"
                            class="form-select"
                            required>

                        <option value="">
                            Select Patient
                        </option>


                        <option th:each="p : ${patients}"
                                th:value="${p.id}"
                                th:text="${p.name + ' · ' + p.phone}">
                        </option>

                    </select>


                    <div class="text-danger small"
                         th:if="${patientError}"
                         th:text="${patientError}">
                    </div>

                </div>



                <!-- ========================= -->
                <!-- DOCTOR -->
                <!-- ========================= -->

                <div class="mb-3">

                    <label class="form-label">
                        Doctor
                        <span class="text-danger">*</span>
                    </label>


                    <select name="doctorId"
                            class="form-select"
                            required>

                        <option value="">
                            Select Doctor
                        </option>


                        <option th:each="d : ${doctors}"
                                th:value="${d.id}"
                                th:text="${d.name + ' · ' + d.specialization}">
                        </option>

                    </select>


                    <div class="text-danger small"
                         th:if="${doctorError}"
                         th:text="${doctorError}">
                    </div>

                </div>



                <!-- ========================= -->
                <!-- DATE & TIME -->
                <!-- ========================= -->

                <div class="mb-3">

                    <label class="form-label">
                        Date & Time
                        <span class="text-danger">*</span>
                    </label>


                    <input type="datetime-local"
                           class="form-control"
                           th:field="*{appointmentDate}"
                           required>


                    <div class="text-danger small"
                         th:if="${appointmentDateError}"
                         th:text="${appointmentDateError}">
                    </div>

                </div>



                <!-- ========================= -->
                <!-- REASON -->
                <!-- ========================= -->

                <div class="mb-3">

                    <label class="form-label">
                        Reason
                        <span class="text-danger">*</span>
                    </label>


                    <textarea class="form-control"
                              th:field="*{reason}"
                              rows="3"
                              required
                              maxlength="500"
                              placeholder="Enter reason for appointment"></textarea>


                    <div class="text-danger small"
                         th:if="${reasonError}"
                         th:text="${reasonError}">
                    </div>

                </div>



                <!-- ========================= -->
                <!-- BUTTONS -->
                <!-- ========================= -->

                <button type="submit"
                        class="btn btn-primary">

                    Schedule Appointment

                </button>


                <a class="btn btn-light"
                   th:href="@{/appointments}">

                    Cancel

                </a>


            </form>

        </div>

    </div>

</main>


</body>

</html>
