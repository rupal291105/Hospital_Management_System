<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Create Bill | CityCare HMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container py-4">

    <div class="card border-0 shadow-sm mx-auto"
         style="max-width:700px">

        <div class="card-body p-4">

            <h2 class="mb-4">Create Bill</h2>

            <form th:action="@{/bills/save}"
                  method="post">

                <!-- PATIENT -->
                <div class="mb-3">

                    <label for="patientId"
                           class="form-label">
                        Patient
                        <span class="text-danger">*</span>
                    </label>

                    <select id="patientId"
                            name="patientId"
                            class="form-select"
                            required>

                        <option value=""
                                disabled
                                selected>
                            -- Select Patient --
                        </option>

                        <option th:each="p : ${patients}"
                                th:value="${p.id}"
                                th:text="${p.name + ' - ' + p.phone}">
                        </option>

                    </select>

                    <div class="text-danger small"
                         th:if="${patientError}"
                         th:text="${patientError}">
                    </div>

                </div>


                <!-- TOTAL AMOUNT -->
                <div class="mb-3">

                    <label for="totalAmount"
                           class="form-label">

                        Total Amount (₹)
                        <span class="text-danger">*</span>

                    </label>

                    <input type="number"
                           id="totalAmount"
                           name="totalAmount"
                           class="form-control"
                           min="0.01"
                           step="0.01"
                           required
                           placeholder="Enter total amount">

                    <div class="text-danger small"
                         th:if="${amountError}"
                         th:text="${amountError}">
                    </div>

                </div>


                <!-- PAID AMOUNT -->
                <div class="mb-3">

                    <label for="paidAmount"
                           class="form-label">

                        Paid Amount (₹)
                        <span class="text-danger">*</span>

                    </label>

                    <input type="number"
                           id="paidAmount"
                           name="paidAmount"
                           class="form-control"
                           min="0"
                           step="0.01"
                           required
                           placeholder="Enter paid amount">

                    <div class="text-danger small"
                         th:if="${paidAmountError}"
                         th:text="${paidAmountError}">
                    </div>

                </div>


                <!-- BUTTONS -->
                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-primary">
                        Save Bill
                    </button>

                    <a class="btn btn-light"
                       th:href="@{/bills}">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</main>

</body>
</html>
