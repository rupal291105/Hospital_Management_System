<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Create Bill</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav><div class="brand">🏥 MediCare HMS</div><div><a href="/">Dashboard</a><a href="/patients">Patients</a><a href="/doctors">Doctors</a><a href="/appointments">Appointments</a><a href="/bills">Billing</a></div></nav>
<main class="form-page"><h1>Create Bill</h1>
<form class="form" th:action="@{/bills/save}" th:object="${bill}" method="post">
<label>Patient<select name="patientId" required><option value="">Select patient</option><option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option></select></label>
<label>Total Amount<input type="number" step="0.01" min="0" th:field="*{totalAmount}" required></label>
<label>Paid Amount<input type="number" step="0.01" min="0" th:field="*{paidAmount}" required></label>
<div><button class="button">Generate Bill</button><a class="button secondary" href="/bills">Cancel</a></div>
</form></main></body></html>
