<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Patient Form | CityCare HMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container py-4">

    <div class="card border-0 shadow-sm mx-auto" style="max-width:800px">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Register Patient
            </h2>

            <form th:action="@{/patients/save}"
                  th:object="${patient}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">
                            Name <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{name}"
                               required
                               maxlength="100"
                               placeholder="Enter full name">

                        <div class="text-danger small"
                             th:errors="*{name}">
                        </div>
                    </div>


                    <div class="col-md-6">
                        <label class="form-label">
                            Age <span class="text-danger">*</span>
                        </label>

                        <input type="number"
                               class="form-control"
                               th:field="*{age}"
                               required
                               min="0"
                               max="120"
                               placeholder="Enter age">

                        <div class="text-danger small"
                             th:errors="*{age}">
                        </div>
                    </div>


                    <div class="col-md-4">
                        <label class="form-label">
                            Gender <span class="text-danger">*</span>
                        </label>

                        <select class="form-select"
                                th:field="*{gender}"
                                required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                        <div class="text-danger small"
                             th:errors="*{gender}">
                        </div>
                    </div>


                    <div class="col-md-4">
                        <label class="form-label">
                            Phone <span class="text-danger">*</span>
                        </label>

                        <input type="tel"
                               class="form-control"
                               th:field="*{phone}"
                               required
                               pattern="[0-9]{10}"
                               minlength="10"
                               maxlength="10"
                               placeholder="10 digit phone number">

                        <div class="text-danger small"
                             th:errors="*{phone}">
                        </div>
                    </div>


                    <div class="col-md-4">
                        <label class="form-label">
                            Email <span class="text-danger">*</span>
                        </label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               required
                               placeholder="example@gmail.com">

                        <div class="text-danger small"
                             th:errors="*{email}">
                        </div>
                    </div>


                    <div class="col-12">
                        <label class="form-label">
                            Address <span class="text-danger">*</span>
                        </label>

                        <textarea class="form-control"
                                  rows="2"
                                  th:field="*{address}"
                                  required
                                  maxlength="255"
                                  placeholder="Enter complete address"></textarea>

                        <div class="text-danger small"
                             th:errors="*{address}">
                        </div>
                    </div>


                    <div class="col-12">
                        <label class="form-label">
                            Medical History <span class="text-danger">*</span>
                        </label>

                        <textarea class="form-control"
                                  rows="3"
                                  th:field="*{medicalHistory}"
                                  required
                                  maxlength="1000"
                                  placeholder="Enter medical history"></textarea>

                        <div class="text-danger small"
                             th:errors="*{medicalHistory}">
                        </div>
                    </div>

                </div>


                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-primary">
                        Save Patient
                    </button>

                    <a class="btn btn-light"
                       th:href="@{/patients}">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</main>

</body>
</html>
