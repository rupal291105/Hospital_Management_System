<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Patient</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav>
    <div class="brand">🏥 MediCare HMS</div>

    <div>
        <a href="/">Dashboard</a>
        <a href="/patients">Patients</a>
        <a href="/doctors">Doctors</a>
        <a href="/appointments">Appointments</a>
        <a href="/bills">Billing</a>
    </div>
</nav>

<main class="form-page">

    <h1>Add Patient</h1>

    <form class="form"
          th:action="@{/patients/save}"
          th:object="${patient}"
          method="post">

        <!-- Patient Name -->
        <label>
            Name
            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter patient name"
                   required>
        </label>

        <!-- Age -->
        <label>
            Age
            <input type="number"
                   th:field="*{age}"
                   placeholder="Enter age"
                   min="0">
        </label>

        <!-- Gender -->
        <label>
            Gender
            <select th:field="*{gender}">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </label>

        <!-- Phone -->
        <label>
            Phone
            <input type="tel"
                   th:field="*{phone}"
                   placeholder="Enter phone number">
        </label>

        <!-- Email -->
        <label>
            Email
            <input type="email"
                   th:field="*{email}"
                   placeholder="Enter email address">
        </label>

        <!-- Address -->
        <label>
            Address
            <textarea th:field="*{address}"
                      placeholder="Enter address"></textarea>
        </label>

        <!-- Medical History -->
        <label>
            Medical History
            <textarea th:field="*{medicalHistory}"
                      placeholder="Enter medical history"></textarea>
        </label>

        <!-- Buttons -->
        <div>
            <button type="submit" class="button">
                Save Patient
            </button>

            <a class="button secondary" href="/patients">
                Cancel
            </a>
        </div>

    </form>

</main>

</body>
</html>
